<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content: on browsers that honor it, the
         layout viewport (and dvh/vh units, and `position: fixed` sizing)
         shrinks when the on-screen keyboard opens, instead of only the
         visual viewport — without it, fixed full-screen overlays keep
         sizing themselves as if the keyboard weren't there, and their
         lower portion ends up hidden behind it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Trip Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
