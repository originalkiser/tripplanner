name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Supabase's anon key is meant to be public — it's already baked
          # into the deployed JS bundle regardless of where it's sourced
          # from. RLS, not secrecy, is what actually protects the data.
          VITE_SUPABASE_URL: https://cjpgupcwprdjvebclsnm.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqcGd1cGN3cHJkanZlYmNsc25tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTE4MTYsImV4cCI6MjEwMjg4NzgxNn0.clA1Q6Lq6WW3_SVXpPMNhHr6kgjBkO1Xzv7wk7HH40s
        run: npm run build

      - name: SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
